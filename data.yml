touch_acceptability:
    title: "Acceptability of Social Touch in VR"
    year: "2025-2026"
    category: "Academic projects"
    status: "Post-doc"
    location: "Heudiasyc (UTC) & ISIR (Sorbonne Université), France"
    keywords: ["Unity", "C#", "Virtual Reality", "Haptics", "Social Touch", "Wizard-of-Oz", "Methodology"]
    summary: "
        This project studies when, and from whom, social touch is acceptable in virtual reality. We adapted the Wizard-of-Oz method to embodied social interaction in VR: the partner is always an experimenter-controlled avatar behaving identically, while participants are told it is either a remote human or an autonomous agent. In a 2x2 between-subjects experiment (N = 47) built on a storytelling task, what participants believed about the partner changed how its empathic touch was received, without changing how human the partner was judged to be.
    "
    paper_title: "When a Virtual Agent Touches You: How a Partner's Attributed Agency Shapes the Acceptability of Social Touch in VR"
    conf_short: "EuroXR 2026"
    conf_long: "To appear in Proceedings of the EuroXR 2026 International Conference"
    authors: ["gregoire.richard", "catherine.pelachaud", "yohan.bouvet", "indira.thouvenin"]
    icon: "touch_acceptability.jpg"
    links: []

################################################################################

social_touch_modalities:
    title: "Multisensory Feedback for Social Touch"
    year: "2023-2025"
    category: "Academic projects"
    status: "Post-doc"
    location: "Heudiasyc (UTC) & ISIR (Sorbonne Université), France"
    keywords: ["Unity", "C#", "Virtual Reality", "Haptics", "Social Touch", "Virtual Agents", "Multisensory Feedback"]
    summary: "
        This project investigates how visual, audio and tactile feedback, alone and combined, contribute to the perception of being socially touched by a virtual agent in VR. Three experiments progressively isolate and combine these modalities. Multisensory feedback improves the experience of social touch: visual and tactile feedback are the main contributors to feeling touched, audio feedback also has a significant impact, and the agent's level of animation and interpersonal distance shape how much it is felt as a social partner.
    "
    paper_title: "\"Did she just tap me?\": Qualifying Multisensory Feedback for Social Touch during Human-Agent Interaction in Virtual Reality"
    conf_short: "Frontiers in VR"
    conf_long: "Frontiers in Virtual Reality, vol. 6, 2025"
    authors: ["gregoire.richard", "fabien.boucaud", "catherine.pelachaud", "indira.thouvenin"]
    icon: "social_touch_modalities.png"
    links:
        - {type: doi, url: "https://doi.org/10.3389/frvir.2025.1718198"}
        - {type: pdf, url: "https://hal.science/hal-05386969"}

