
##################################### INFOS ####################################

aboutme:
    name: "Grégoire Richard"
    catchphrase: "Associate Professor (Maître de conférences) in Computer Science"
    image: "CV_picture.jpg"
    text: "I am an Associate Professor (Maître de conférences) in Computer Science at Le Mans Université, France.
    I teach at the IUT de Laval and conduct my research at LIUM (Computer Science Lab of Le Mans University), in the IEIAH team (Technology Enhanced Learning).
    I work in Human-Computer Interaction (HCI) and Virtual Reality (VR), on haptic feedback and multisensory interaction:
    I am interested in how a designed signal (tactile, visual, auditory) shapes what people perceive, understand and feel during an interaction, and in the experimental methodology needed to study it.
    My current work extends this line towards learning: I study how haptic and multimodal signals can guide gestures, support collaboration and structure learning in immersive environments."
    links:
        # Obfuscated on purpose (no mailto:) to avoid harvesting by bots
        - {type: mail, name: "gregoire (dot) richard (at) univ-lemans (dot) fr", url: "#home"}
        - {type: linkedin, url: "https://www.linkedin.com/in/gr%C3%A9goire-richard-533311102/"}
        - {type: github, url: "https://github.com/GregoireRichar"}
        - {type: resume, name: "resume", url: "./documents/RICHARD_Gregoire_2023.pdf"}

