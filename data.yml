vib_ctrller:
    title: "Spatialized Vibrotactile Controller"
    year: "2021-2022"
    category: "Academic projects"
    status: "PhD"
    location: "CRIStAL-Inria, University of Lille France"
    keywords: ["Unity", "C#", "Haptics", "Virtual Reality", "Arduino", "3D Printing", "Python"]
    summary: "
        This project aimed at designing a controller for VR that enabled spatialized vibrations through the use of the funneling effect. Several aspects of the controller were assessed.Performance-wise, users' ability to locate static vibrations, and their ability to follow dynamic patterns. In terms of user experience, the impact of vibrotactile feedback on embodiment as explored.
    "
    paper_title: '<a href="./multivibes/index.html">MultiVibes: What if your VR Controller had 10 Times more Vibrotactile Actuators?</a>'
    category: "International Conferences"
    conf_short: "IEEE ISMAR 2023"
    conf_long: "Proceedings of 2023 IEEE International Symposium on Mixed and Augmented Reality (ISMAR)"
    authors: ["gregoire.richard", "thomas.pietrzak", "ferran.argelaguet", "anatole.lecuyer", "gery.casiez"]
    icon: "proto_module_detoure.png"
    links:
        - {type: video, url: "https://youtu.be/HwexIJg6-AY"}


